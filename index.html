<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PWhy BoomBoom 💖</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; color: #fff; touch-action: manipulation; }

    /* ============ Splash ============ */
    #splash { position: fixed; inset: 0; background: #0f172a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s; }
    #splash.hide { opacity: 0; pointer-events: none; }
    .spinner { width: 50px; height: 50px; border: 4px solid rgba(244,63,94,0.2); border-top-color: #f43f5e; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    #splash h3 { color: #f43f5e; font-size: 18px; margin-bottom: 6px; }
    #splash p { color: #64748b; font-size: 12px; }

    /* ============ Header ============ */
    .header { position: fixed; top: 0; left: 0; right: 0; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: rgba(15,23,42,0.85); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(244,63,94,0.2); z-index: 10; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(244,63,94,0.15); border: 1px solid rgba(244,63,94,0.4); display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px; color: #f43f5e; }
    .user-name { font-size: 14px; font-weight: 600; }
    .user-level { font-size: 11px; color: #f43f5e; }
    .header-actions { display: flex; gap: 6px; }
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(244,63,94,0.15); border: 1px solid rgba(244,63,94,0.4); color: #f43f5e; font-size: 16px; display: flex; justify-content: center; align-items: center; cursor: pointer; padding: 0; transition: transform 0.15s; }
    .icon-btn:active { transform: scale(0.9); }
    .icon-btn.muted { background: rgba(239,68,68,0.2); border-color: #ef4444; color: #fca5a5; }

    /* ============ Score ============ */
    .score-panel { position: fixed; top: 75px; left: 0; right: 0; text-align: center; z-index: 9; }
    .score-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .score-value { font-size: 48px; font-weight: 900; color: #f43f5e; text-shadow: 0 0 20px rgba(244,63,94,0.5); display: flex; justify-content: center; align-items: center; gap: 10px; }
    .score-value .heart { font-size: 40px; }

    /* ============ Heart ============ */
    #heart-stage { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 5; cursor: pointer; }
    .heart-wrapper { position: relative; width: 240px; height: 240px; display: flex; justify-content: center; align-items: center; transition: transform 0.1s; }
    .heart-wrapper:active { transform: scale(0.92); }
    .heart-main { font-size: 200px; line-height: 1; filter: drop-shadow(0 0 30px rgba(244,63,94,0.7)); animation: heartbeat 1.4s ease-in-out infinite; user-select: none; }
    @keyframes heartbeat { 0%, 100% { transform: scale(1); } 25% { transform: scale(1.06); } 50% { transform: scale(1); } 75% { transform: scale(1.03); } }
    .heart-wrapper.pop .heart-main { animation: heartPop 0.2s ease-out; }
    @keyframes heartPop { 0% { transform: scale(1); } 50% { transform: scale(1.25); } 100% { transform: scale(1); } }

    /* Floating hearts */
    .floating-heart { position: fixed; pointer-events: none; font-size: 28px; z-index: 100; animation: floatHeart 1s ease-out forwards; }
    @keyframes floatHeart { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); } 50% { opacity: 1; transform: translate(-50%, -80%) scale(1.3); } 100% { opacity: 0; transform: translate(-50%, -150%) scale(0.8); } }

    /* Burst hearts */
    .burst-heart { position: fixed; pointer-events: none; font-size: 20px; z-index: 99; animation: burstHeart 0.9s ease-out forwards; }
    @keyframes burstHeart { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.5); } }

    /* Combo indicator */
    .combo-indicator { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 48px; font-weight: 900; color: #f59e0b; text-shadow: 0 0 20px rgba(245,158,11,0.9); pointer-events: none; z-index: 200; animation: comboPop 0.6s ease-out; }
    @keyframes comboPop { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; } 50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -70%) scale(1); opacity: 0; } }

    /* ============ Bottom ============ */
    .bottom-panel { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px 16px; background: rgba(15,23,42,0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(244,63,94,0.2); z-index: 10; }
    .energy-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    .energy-header .label { color: #94a3b8; }
    .energy-header .value { color: #f43f5e; }
    .energy-bar { width: 100%; height: 10px; background: rgba(255,255,255,0.08); border-radius: 5px; overflow: hidden; margin-bottom: 12px; }
    .energy-fill { height: 100%; background: linear-gradient(90deg, #f43f5e, #ec4899); border-radius: 5px; transition: width 0.3s; }
    .ad-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(135deg, #ec4899, #f43f5e); border: none; border-radius: 14px; padding: 14px; color: #fff; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(244,63,94,0.4); position: relative; }
    .ad-btn:active { transform: scale(0.97); }
    .ad-btn:disabled { opacity: 0.5; }
    .ad-btn .icon { font-size: 22px; }
    .ad-cooldown { position: absolute; top: 4px; right: 10px; background: rgba(0,0,0,0.5); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: bold; }

    /* ============ Boost badges ============ */
    .boosts-bar { position: fixed; top: 175px; right: 12px; z-index: 11; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
    .boost-chip { background: rgba(15,23,42,0.9); border: 1px solid #f59e0b; border-radius: 20px; padding: 5px 12px; font-size: 12px; font-weight: bold; color: #f59e0b; backdrop-filter: blur(8px); }

    /* ============ Modal ============ */
    .modal-overlay { position: fixed; inset: 0; background: rgba(2,6,23,0.85); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 500; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: rgba(15,23,42,0.98); border: 1px solid rgba(244,63,94,0.4); border-radius: 22px; padding: 26px; text-align: center; max-width: 92vw; width: 420px; animation: popIn 0.3s; }
    @keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-icon { font-size: 56px; display: block; margin-bottom: 10px; }
    .modal-card h2 { color: #f43f5e; font-size: 20px; margin-bottom: 8px; }
    .modal-card p { color: #94a3b8; font-size: 13px; margin-bottom: 18px; line-height: 1.6; }
    .modal-btn { background: linear-gradient(135deg, #ec4899, #f43f5e); border: none; border-radius: 14px; padding: 12px 26px; color: #fff; font-weight: bold; font-size: 14px; cursor: pointer; }
    .modal-btn:active { transform: scale(0.96); }

    /* ============ Tutorial ============ */
    .tut-step { display: flex; align-items: center; gap: 14px; padding: 10px; margin-bottom: 10px; background: rgba(244,63,94,0.08); border-radius: 12px; text-align: start; }
    .tut-step .emoji { font-size: 26px; }
    .tut-step .txt { color: #cbd5e1; font-size: 13px; }

    html[dir="rtl"] .tut-step { text-align: right; }
    html[dir="ltr"] .tut-step { text-align: left; }
  </style>
</head>
<body>

  <!-- Splash -->
  <div id="splash">
    <div class="spinner"></div>
    <h3 data-i18n="splashTitle">Loading PWhy BoomBoom... 💖</h3>
    <p data-i18n="splashSub">Preparing hearts</p>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="user-info">
      <div class="user-avatar" id="user-avatar">💖</div>
      <div>
        <div class="user-name" id="user-name">Player</div>
        <div class="user-level">💖 <span data-i18n="level">Level</span> <span id="user-level-num">1</span></div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="lang-btn" onclick="toggleLanguage()" title="Language">🌐</button>
      <button class="icon-btn" id="mute-btn" onclick="toggleMute()" title="Sound">🔊</button>
    </div>
  </header>

  <!-- Score -->
  <div class="score-panel">
    <div class="score-label" data-i18n="scoreLabel">Total Booms</div>
    <div class="score-value">
      <span id="score">0</span>
      <span class="heart">💖</span>
    </div>
  </div>

  <!-- Boost badges -->
  <div class="boosts-bar" id="boosts-bar"></div>

  <!-- Heart Stage -->
  <div id="heart-stage">
    <div class="heart-wrapper" id="heart-wrapper">
      <div class="heart-main">💖</div>
    </div>
  </div>

  <!-- Bottom Panel -->
  <div class="bottom-panel">
    <div class="energy-header">
      <span class="label">⚡ <span data-i18n="energy">Energy</span></span>
      <span class="value"><span id="energy">1000</span> / <span id="max-energy">1000</span></span>
    </div>
    <div class="energy-bar">
      <div class="energy-fill" id="energy-fill" style="width:100%"></div>
    </div>
    <button class="ad-btn" id="ad-btn" onclick="watchAd()">
      <span class="icon">📺</span>
      <span id="ad-btn-text" data-i18n="watchAd">Watch Ad → +1000 Hearts</span>
      <span class="ad-cooldown" id="ad-cooldown" style="display:none;">0:00</span>
    </button>
  </div>

  <!-- Tutorial -->
  <div id="tut-modal" class="modal-overlay">
    <div class="modal-card">
      <span class="modal-icon">💖</span>
      <h2 data-i18n="tutTitle">Welcome to PWhy BoomBoom!</h2>
      <p data-i18n="tutSub">Quick start guide</p>
      <div class="tut-step"><span class="emoji">👆</span><span class="txt" data-i18n="tutStep1">Tap the heart to earn Booms.</span></div>
      <div class="tut-step"><span class="emoji">⚡</span><span class="txt" data-i18n="tutStep2">Watch your energy — it regenerates.</span></div>
      <div class="tut-step"><span class="emoji">📺</span><span class="txt" data-i18n="tutStep3">Watch ads for +1000 hearts.</span></div>
      <button class="modal-btn" onclick="closeTutorial()" data-i18n="tutStart">🚀 Let's go!</button>
    </div>
  </div>

  <!-- Alert Modal -->
  <div id="alert-modal" class="modal-overlay">
    <div class="modal-card">
      <span class="modal-icon" id="alert-icon">✓</span>
      <h2 id="alert-title">Done</h2>
      <p id="alert-message"></p>
      <button class="modal-btn" onclick="closeAlert()" data-i18n="ok">OK</button>
    </div>
  </div>

  <script src="sound.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
